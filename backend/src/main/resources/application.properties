# Application Configuration
spring.application.name=InvoiceMe
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/invoiceme
spring.datasource.username=invoiceme_user
spring.datasource.password=invoiceme_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Logging
logging.level.root=INFO
logging.level.com.invoiceme=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# JWT Configuration
# Secret key for JWT signing (256-bit minimum for HS256)
# For production: Set JWT_SECRET environment variable
# For development: Uses default below if env var not set
jwt.secret=${JWT_SECRET:5a7b3f8e9d2c1a4b6e8f0d3c5a7b9e1f3d5c7a9b1e3f5d7c9b1a3e5f7d9c1a3e}
# JWT expiration time in milliseconds (24 hours = 86400000ms)
jwt.expiration=86400000

# Admin User Configuration (Development defaults)
# For production: Set ADMIN_USERNAME, ADMIN_PASSWORD, ADMIN_EMAIL environment variables
# These are only used if environment variables are not set
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.email=${ADMIN_EMAIL:admin@invoiceme.com}

