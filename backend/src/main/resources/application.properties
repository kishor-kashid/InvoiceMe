# Application Configuration
spring.application.name=InvoiceMe
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/invoiceme
spring.datasource.username=invoiceme_user
spring.datasource.password=invoiceme_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Enable second-level cache for better performance
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
# Enable query cache
spring.jpa.properties.hibernate.cache.use_query_cache=false
# Batch processing for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Connection provider settings
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
# Statistics for monitoring (disable in production)
spring.jpa.properties.hibernate.generate_statistics=false

# Connection Pool Configuration (HikariCP)
# Pool sizing for optimal performance
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
# Connection acquisition timeout (20 seconds)
spring.datasource.hikari.connection-timeout=20000
# Maximum lifetime of a connection in pool (30 minutes)
spring.datasource.hikari.max-lifetime=1800000
# How long a connection can sit idle before being removed (10 minutes)
spring.datasource.hikari.idle-timeout=600000
# Connection test query
spring.datasource.hikari.connection-test-query=SELECT 1
# Validate connections before use
spring.datasource.hikari.validation-timeout=5000
# Leak detection threshold (2 minutes - helps identify connection leaks)
spring.datasource.hikari.leak-detection-threshold=120000
# Allow pool suspension during maintenance
spring.datasource.hikari.allow-pool-suspension=true
# Auto-commit behavior (true for better performance with read operations)
spring.datasource.hikari.auto-commit=true

# Logging
logging.level.root=INFO
logging.level.com.invoiceme=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# JWT Configuration
# Secret key for JWT signing (256-bit minimum for HS256)
# For production: Set JWT_SECRET environment variable
# For development: Uses default below if env var not set
jwt.secret=${JWT_SECRET:5a7b3f8e9d2c1a4b6e8f0d3c5a7b9e1f3d5c7a9b1e3f5d7c9b1a3e5f7d9c1a3e}
# JWT expiration time in milliseconds (24 hours = 86400000ms)
jwt.expiration=86400000

# Admin User Configuration (Development defaults)
# For production: Set ADMIN_USERNAME, ADMIN_PASSWORD, ADMIN_EMAIL environment variables
# These are only used if environment variables are not set
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.email=${ADMIN_EMAIL:admin@invoiceme.com}

