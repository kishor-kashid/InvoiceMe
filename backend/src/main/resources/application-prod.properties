# Production Configuration
# This profile should be used for production deployments

# Application
spring.application.name=InvoiceMe
server.port=${PORT:8080}

# Database Configuration
# Override with environment variables in production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/invoiceme}
spring.datasource.username=${DATABASE_USERNAME:invoiceme_user}
spring.datasource.password=${DATABASE_PASSWORD:invoiceme_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration - Use validate in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000

# Logging - INFO level for production
logging.level.root=INFO
logging.level.com.invoiceme=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# CORS Configuration - Restrict to production domain
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# JWT Configuration
# MUST be set via JWT_SECRET environment variable in production
# Do not use default value in production!
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Admin User Configuration
# MUST be set via environment variables in production
# Do not use default values!
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL}

